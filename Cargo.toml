[package]
name = "cs2-helper"
version = "0.4.0"
edition = "2021"

[dependencies]
# Парсер демок CS2 (LaihoE/demoparser)
parser = { git = "https://github.com/LaihoE/demoparser", package = "parser" }
ahash = "0.8"
anyhow = "1"
# Окно приложения, диалог выбора файла, картинки
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
# Библиотека раскидок: сохранение и буфер обмена
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
